# Run with:  docker compose up --build
# Then open: http://127.0.0.1:8000
services:
  importer:
    build: .
    image: prestashop-supplier-importer
    container_name: prestashop-importer
    ports:
      # Bind to the host loopback only — the tool stays localhost-only.
      - "127.0.0.1:8000:8000"
    env_file:
      # Optional: put PRESTASHOP_URL / PRESTASHOP_API_KEY here. You can also
      # just enter them in the Settings tab at runtime, so .env is not required.
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/appdata/app.sqlite3
      DEFAULT_LANG_ID: "1"
    volumes:
      # Persist import history + saved mapping profiles across restarts.
      - importer-data:/app/appdata
    # Lets the container reach a PrestaShop running on the host machine.
    # If your shop is on the host (e.g. http://localhost:8080), set the
    # Shop base URL to http://host.docker.internal:8080 in the Settings tab.
    # (Works out of the box on Docker Desktop; this line is needed on Linux.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  importer-data:
